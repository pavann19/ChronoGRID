[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "chronogrid"
version = "2.0.0.dev0"
description = "German day-ahead load forecasting and evidence research platform"
readme = "OPERATIONS.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "ChronoGrid Engineering Team"}]
keywords = ["time-series", "forecasting", "uncertainty", "energy", "research"]
dependencies = [
    "fastapi==0.162.0", "uvicorn==0.54.0", "pydantic==2.14.2",
    "numpy==2.4.4", "pandas==2.2.3", "requests==2.34.2",
    "scikit-learn==1.8.0", "joblib==1.4.2", "onnxruntime==1.24.4",
    "tzdata==2026.6", "python-dateutil==4.0.0",
]

[project.optional-dependencies]
diagnostics = ["SQLAlchemy==2.1.8", "prometheus-client==0.26.0", "pyarrow==26.0.1"]
research = ["lightgbm>=4.0", "xgboost>=2.0", "scipy>=1.14", "statsmodels>=0.14", "PyYAML>=6.0"]
export = ["onnx>=1.16", "skl2onnx>=1.17", "onnxmltools>=1.14"]
tracking = ["mlflow-skinny>=3.0", "SQLAlchemy==2.1.8"]
parquet = ["pyarrow==26.0.1"]
postgres = ["psycopg2-binary>=2.9.9", "SQLAlchemy==2.1.8"]
dashboard = ["streamlit>=1.44", "SQLAlchemy==2.1.8", "prometheus-client==0.26.0"]
dev = ["pytest>=9.2", "pytest-cov>=6.0", "hypothesis>=6.100", "ruff>=0.4", "httpx==0.28.1", "pip-audit>=2.10.1"]

[project.scripts]
chronogrid-ops = "src.operations.cli:main"
chronogrid-registry = "src.operations.registry_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = false

[tool.setuptools.package-data]
"src.operations" = ["feature_contract_bindings.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"
