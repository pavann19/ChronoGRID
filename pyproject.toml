[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronogrid"
version = "1.0.0"
description = "Production ML Forecasting & MLOps Platform for German Day-Ahead Electricity Grid Load"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "ChronoGrid Engineering Team"}
]
keywords = [
    "machine-learning",
    "time-series-forecasting",
    "mlops",
    "onnx",
    "energy-markets",
    "day-ahead",
    "smard",
    "dwd"
]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "prometheus-client>=0.20.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "skl2onnx>=1.17.0",
    "onnxmltools>=1.14.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "joblib>=1.4.0",
    "mlflow-skinny>=3.0.0",
    "statsmodels>=0.14.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

