name: ChronoGRID CI
on:
  push:
    branches: [master, portfolio-cleanup]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,research,export,tracking,diagnostics]"
      - run: make lint
      - run: python -m pytest --cov=chronogrid --cov-report=xml
      - run: python scripts/audit_gate.py
      - run: python scripts/preserve_research_evidence.py --verify
      - run: python -m pip_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.python-version }}
          path: |
            coverage.xml
            artifacts/reports/gate_audit.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployment/Dockerfile -t chronogrid:ci .
      - run: docker build -f deployment/Dockerfile.operations -t chronogrid-operations:ci .
