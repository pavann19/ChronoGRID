name: Clean-context container builds
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [operations, service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build committed context without local wheels and probe isolated runtime
        run: python scripts/verify_clean_container_builds.py --profile ${{ matrix.profile }} --output output/clean-container-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-container-${{ matrix.profile }}
          path: output/clean-container-ci/
