repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^artifacts/
      - id: ruff-format
        exclude: ^artifacts/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^artifacts/
      - id: trailing-whitespace
        exclude: ^artifacts/
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^artifacts/experiments/weather_v4/replay_evidence.zip$
