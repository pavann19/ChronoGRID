version: "3.8"

services:
  chronogrid-api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: chronogrid-serving
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - WORKERS=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

